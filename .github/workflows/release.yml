name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build and test
        run: |
          dotnet build src/JCenterLite.App/JCenterLite.App.csproj -c Release -p:Platform=x64
          dotnet test tests/JCenterLite.Core.Tests/JCenterLite.Core.Tests.csproj -c Release

      - name: Package self-contained win-x64 build
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          ./tools/build-release.ps1 -Version $version

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = Get-ChildItem dist/J-Center-Lite-*-win-x64.zip | Select-Object -First 1
          if (-not $zip) { throw 'package zip not found' }
          gh release create $tag `
            $zip.FullName `
            "$($zip.FullName).sha256" `
            --title "J-Center-Lite $tag" `
            --generate-notes
